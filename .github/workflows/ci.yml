name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stocksense
          POSTGRES_PASSWORD: stocksense
          POSTGRES_DB: stocksense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stocksense -d stocksense_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint and test the API
        working-directory: server
        env:
          DATABASE_URL: postgres://stocksense:stocksense@localhost:5432/stocksense_test
          JWT_SECRET: ci-test-secret
        run: |
          npm ci
          npm run lint
          npm test
      - name: Lint and build the UI
        working-directory: client
        run: |
          npm ci
          npm run lint
          npm run build
